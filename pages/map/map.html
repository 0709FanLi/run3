<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>百度地图</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <script type="text/javascript" src="//api.map.baidu.com/api?type=webgl&v=1.0&ak=lk6K6qQBy3YNtjsCQ3QsJ4wwuNNP2wvG"></script>
    <style type="text/css">
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // 创建地图实例
        var map = new BMapGL.Map("map");
        var currentMarker = null;
        var polyline = null;
        var points = [];

        // 在 script 标签中添加坐标转换方法
        function gcj02toBd09(lng, lat) {
            const x_PI = 3.14159265358979324 * 3000.0 / 180.0;
            const z = Math.sqrt(lng * lng + lat * lat) + 0.00002 * Math.sin(lat * x_PI);
            const theta = Math.atan2(lat, lng) + 0.000003 * Math.cos(lng * x_PI);
            const bd_lng = z * Math.cos(theta) + 0.0065;
            const bd_lat = z * Math.sin(theta) + 0.006;
            return {
                lng: bd_lng,
                lat: bd_lat
            };
        }

        // 监听来自App的消息
        window.addEventListener('message', function(event) {
            var data = event.data;
            if (data.type === 'updateLocation') {
                // 转换坐标系
                var bdPoint = gcj02toBd09(data.longitude, data.latitude);
                var point = new BMapGL.Point(bdPoint.lng, bdPoint.lat);
                points.push(point);
                
                // 更新当前位置标记
                if (!currentMarker) {
                    currentMarker = new BMapGL.Marker(point);
                    map.addOverlay(currentMarker);
                    map.centerAndZoom(point, 16);
                    
                    // 添加定位控件
                    var locationControl = new BMapGL.LocationControl();
                    map.addControl(locationControl);
                } else {
                    currentMarker.setPosition(point);
                    map.panTo(point);
                }
                
                // 更新轨迹线
                if (points.length > 1) {
                    if (polyline) {
                        map.removeOverlay(polyline);
                    }
                    polyline = new BMapGL.Polyline(points, {
                        strokeColor: '#18B566',
                        strokeWeight: 4,
                        strokeOpacity: 1
                    });
                    map.addOverlay(polyline);
                }
            } else if (data.type === 'reset') {
                // 重置地图
                points = [];
                if (currentMarker) {
                    map.removeOverlay(currentMarker);
                    currentMarker = null;
                }
                if (polyline) {
                    map.removeOverlay(polyline);
                    polyline = null;
                }
            }
        });
    </script>
</body>
</html>
