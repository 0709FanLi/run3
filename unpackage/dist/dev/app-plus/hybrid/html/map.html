<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>百度地图</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <script type="text/javascript" src="https://api.map.baidu.com/api?type=webgl&v=1.0&ak=lk6K6qQBy3YNtjsCQ3QsJ4wwuNNP2wvG"></script>
    <style type="text/css">
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // 创建地图实例
        var map = new BMapGL.Map("map");
        var currentMarker = null;
        var polyline = null;
        var points = [];
        var x_PI = 3.14159265358979324 * 3000.0 / 180.0;

        // 设置初始中心点和缩放级别
        var defaultPoint = new BMapGL.Point(116.397, 39.909);
        map.centerAndZoom(defaultPoint, 16);
        
        // 开启鼠标滚轮缩放
        map.enableScrollWheelZoom(true);
        
        // 添加地图控件
        map.addControl(new BMapGL.ScaleControl());
        map.addControl(new BMapGL.ZoomControl());
        map.addControl(new BMapGL.LocationControl());

        // 坐标转换方法
        function gcj02toBd09(lng, lat) {
            var x = lng;
            var y = lat;
            var z = Math.sqrt(x * x + y * y) + 0.00002 * Math.sin(y * x_PI);
            var theta = Math.atan2(y, x) + 0.000003 * Math.cos(x * x_PI);
            var bd_lng = z * Math.cos(theta) + 0.0065;
            var bd_lat = z * Math.sin(theta) + 0.006;
            return {
                lng: bd_lng,
                lat: bd_lat
            };
        }

        // 监听来自App的消息
        window.addEventListener('message', function(event) {
            console.log('地图收到位置更新:', event.data);
            var data = event.data;
            if (data.type === 'updateLocation') {
                try {
                    // 转换坐标系
                    var bdPoint = gcj02toBd09(data.longitude, data.latitude);
                    console.log('转换后的百度坐标:', bdPoint);
                    
                    var point = new BMapGL.Point(bdPoint.lng, bdPoint.lat);
                    points.push(point);
                    
                    // 更新当前位置标记
                    if (!currentMarker) {
                        currentMarker = new BMapGL.Marker(point);
                        map.addOverlay(currentMarker);
                        map.centerAndZoom(point, 16);
                        
                        // 添加定位精度圈
                        var circle = new BMapGL.Circle(point, 20, {
                            strokeColor: '#18B566',
                            strokeWeight: 2,
                            strokeOpacity: 0.5,
                            fillColor: '#18B566',
                            fillOpacity: 0.2
                        });
                        map.addOverlay(circle);
                    } else {
                        currentMarker.setPosition(point);
                        map.panTo(point);
                    }
                    
                    // 更新轨迹线
                    if (points.length > 1) {
                        if (polyline) {
                            map.removeOverlay(polyline);
                        }
                        polyline = new BMapGL.Polyline(points, {
                            strokeColor: '#18B566',
                            strokeWeight: 4,
                            strokeOpacity: 1
                        });
                        map.addOverlay(polyline);
                    }
                } catch (err) {
                    console.error('更新位置失败:', err);
                }
            }
        });

        // 通知App地图已准备就绪
        window.parent.postMessage({ type: 'mapReady' }, '*');
    </script>
</body>
</html>
